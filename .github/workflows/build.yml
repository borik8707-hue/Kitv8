name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: unzip -o "*.zip"
      - run: mvn -B clean package -f DialogKits/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: DialogKits-jar
          path: DialogKits/target/*.jar
